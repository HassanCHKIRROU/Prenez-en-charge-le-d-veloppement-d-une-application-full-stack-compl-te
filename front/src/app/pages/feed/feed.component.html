<div class="feed-container">
  <div class="feed-header">
    <h1>Articles</h1>
    <div class="header-actions">
      <div class="sort-options">
        <button mat-button 
                [class.active]="sortOrder === 'desc'" 
                (click)="changeSort('desc')">
          Plus récent
        </button>
        <button mat-button 
                [class.active]="sortOrder === 'asc'" 
                (click)="changeSort('asc')">
          Plus ancien
        </button>
      </div>
      <button mat-raised-button color="primary" (click)="goToCreateArticle()">
        + Créer un article
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Chargement...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && !error" class="articles-list">
    <div *ngIf="articles.length === 0" class="empty">
      <p>Aucun article dans votre fil.</p>
      <p>Abonnez-vous à des thèmes pour voir des articles.</p>
      <button mat-raised-button color="primary" routerLink="/topics">
        Voir les thèmes
      </button>
    </div>

    <!-- Carte article cliquable -->
    <div *ngFor="let article of articles" 
         class="article-card" 
         (click)="goToArticle(article.id)">
      <div class="article-header">
        <h2>{{ article.title }}</h2>
        <span class="topic-badge">{{ article.topicTitle }}</span>
      </div>
      <p class="article-meta">
        Par {{ article.authorUsername }} • 
        {{ article.createdAt | date:'dd/MM/yyyy HH:mm' }}
      </p>
      <p class="article-content">{{ article.content }}</p>
      <button mat-button color="primary" class="read-more">Lire la suite →</button>
    </div>
  </div>
</div>
