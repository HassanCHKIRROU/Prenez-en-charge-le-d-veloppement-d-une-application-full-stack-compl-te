


<div class="page-content">

<div class="feed-container">

  <!-- Barre supérieure -->
  <div class="feed-toolbar">

    <button
      mat-raised-button
      color="primary"
      class="create-button"
      (click)="goToCreateArticle()">

      Créer un article

    </button>

    <div
      class="sort-container"
      (click)="changeSort(sortOrder === 'desc' ? 'asc' : 'desc')">

      <span>Trier par</span>

      <mat-icon>
        {{ sortOrder === 'desc' ? 'south' : 'north' }}
      </mat-icon>

    </div>

  </div>

  <div *ngIf="loading" class="loading">

    Chargement...

  </div>

  <div *ngIf="error" class="error">

    {{ error }}

  </div>

  <div
    *ngIf="!loading && !error"
    class="articles-grid">

    <div
      *ngIf="articles.length === 0"
      class="empty">

      <p>Aucun article dans votre fil.</p>

      <p>Abonnez-vous à des thèmes pour voir des articles.</p>

      <button
        mat-raised-button
        color="primary"
        routerLink="/topics">

        Voir les thèmes

      </button>

    </div>

    
    <!-- CARTE ARTICLE -->
    

    <div
      *ngFor="let article of articles"
      class="article-card"
      (click)="goToArticle(article.id)">

      <h2>

        {{ article.title }}

      </h2>

      <div class="article-info">

        <span>

          {{ article.createdAt | date:'dd/MM/yyyy' }}

        </span>

        <span>

          {{ article.authorUsername }}

        </span>

      </div>

      <div class="article-content">

        {{ article.content }}

      </div>

    </div>

  </div>

</div>
</div>
