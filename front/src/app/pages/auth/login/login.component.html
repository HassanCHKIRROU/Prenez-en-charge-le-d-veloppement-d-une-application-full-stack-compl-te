<div class="login-container">
  <div class="login-card">
    <h1>MDD</h1>
    <h2>Se connecter</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Email ou nom d'utilisateur</mat-label>
        <input matInput formControlName="usernameOrEmail">
        <mat-error *ngIf="loginForm.get('usernameOrEmail')?.hasError('required')">
          Ce champ est requis
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password">
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Ce champ est requis
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          Minimum 8 caractères
        </mat-error>
      </mat-form-field>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>

      <p class="register-link">
        Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
      </p>
    </form>
  </div>
</div>
