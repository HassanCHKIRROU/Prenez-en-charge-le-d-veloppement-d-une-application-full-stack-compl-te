<div class="page-content">
  <div class="article-create-container">

    <!-- En-tête : Flèche de retour + Titre centré -->
    <div class="create-header">
      <button mat-button (click)="goBack()" class="back-btn">
        <span class="arrow-icon"></span>
      </button>
      <h1 class="create-title">Créer un nouvel article</h1>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <form [formGroup]="articleForm" (ngSubmit)="onSubmit()" class="create-form">

      <!-- Champ : Sélectionner un thème -->
      <div class="form-field">
        <label>Sélectionner un thème</label>
        <input matInput formControlName="topicId" placeholder="Sélectionner un thème">
      </div>

      <!-- Champ : Titre de l'article -->
      <div class="form-field">
        <label>Titre de l'article</label>
        <input matInput formControlName="title" placeholder="Titre de l'article">
      </div>

      <!-- Champ : Contenu de l'article -->
      <div class="form-field field-content">
        <label>Contenu de l'article</label>
        <textarea matInput formControlName="content" rows="6" placeholder="Contenu de l'article"></textarea>
      </div>

      <!-- Bouton Créer -->
      <div class="btn-wrapper">
        <button mat-raised-button type="submit" class="btn-create" [disabled]="submitting || articleForm.invalid">
          {{ submitting ? 'Création en cours...' : 'Créer' }}
        </button>
      </div>

    </form>
  </div>
</div>
