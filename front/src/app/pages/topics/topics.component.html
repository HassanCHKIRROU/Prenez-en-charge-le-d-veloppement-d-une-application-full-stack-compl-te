<div class="page-content">
  <div class="topics-container">

    <!-- En-tête -->
    <div class="topics-toolbar">
      <h1 class="topics-title">Thèmes</h1>
    </div>

    <!-- Chargement -->
    <div *ngIf="loading" class="loading">Chargement des thèmes...</div>

    <!-- Erreur -->
    <div *ngIf="error" class="error">{{ error }}</div>

    <!-- Grille des thèmes -->
    <div *ngIf="!loading && !error" class="topics-grid">

      <!-- Message vide -->
      <div *ngIf="topics.length === 0" class="empty">
        <p>Aucun thème disponible.</p>
        <p>Revenez plus tard.</p>
      </div>

      <!-- Carte Thème -->
      <div *ngFor="let topic of topics" class="topic-card">
        <h2>{{ topic.title }}</h2>

        <!--<div class="topic-info">
          <span>Thème</span>
        </div>-->
        

        <div class="topic-content">
          {{ topic.description }}
        </div>

        <div class="topic-actions">
          <button
            *ngIf="!topic.subscribed"
            mat-raised-button
            class="subscribe-button"
            (click)="subscribe(topic.id)"
            [disabled]="loading">
            S'abonner
          </button>

          <span *ngIf="topic.subscribed" class="subscribed-badge">
            Déjà abonné
          </span>
        </div>
      </div>

    </div>

  </div>
</div>
