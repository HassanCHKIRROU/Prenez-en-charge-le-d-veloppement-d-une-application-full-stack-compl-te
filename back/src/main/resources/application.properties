
# SERVEUR
server.port=8080
server.servlet.context-path=/api


# BASE DE DONN\uFFFDES - MySQL

spring.datasource.url=jdbc:mysql://localhost:3306/mdd_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / HIBERNATE
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true


# JWT

#jwt.secret=zJ5nY8tR3mX9cL2wQ7fD4vK6pS1hU8oA
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# LOGGING

logging.level.com.openclassrooms.mddapi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# CORS

cors.allowed.origins=http://localhost:4200


# SWAGGER

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=true